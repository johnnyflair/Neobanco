# Entorno local completo: Postgres, Redis, migraciones + datos de prueba y la API.
#   docker compose up --build
#   API en http://localhost:8000/docs  ·  asociada demo: 88112030 / clave 482915
name: neobanco

x-api-env: &api-env
  NEO_ENV: local
  NEO_DATABASE_URL: postgresql+asyncpg://neo:neo@db:5432/neobanco
  NEO_REDIS_URL: redis://redis:6379/0
  NEO_JWT_SECRET: solo-para-desarrollo-local-cambiar
  NEO_EXPOSE_DEBUG_OTP: "true"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neo
      POSTGRES_PASSWORD: neo
      POSTGRES_DB: neobanco
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neo -d neobanco"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  migrate:
    build: ./backend
    environment: *api-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./backend
    environment: *api-env
    ports: ["8000:8000"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

volumes:
  pgdata:
