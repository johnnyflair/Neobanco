# Despliegue a AWS sin llaves guardadas: GitHub obtiene credenciales temporales por OIDC.
# - Cada merge a main despliega a dev.
# - staging y prod se despliegan a mano (Run workflow) y prod exige aprobación en el
#   ambiente de GitHub "prod" (Settings > Environments > Required reviewers).
#
# Variables por ambiente en GitHub (Settings > Environments > <env> > Variables):
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, TF_STATE_BUCKET, ACM_CERTIFICATE_ARN, DNS_ZONE_NAME (si el dominio está en
#   Route 53) y ALERT_EMAILS (JSON, ej. ["a@b.com"]). Los imprime infra/bootstrap/cloudshell.sh.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente
        type: choice
        options: [dev, staging, prod]
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar a ${{ inputs.environment || 'dev' }}
    # Los despliegues automáticos arrancan cuando AWS está listo: variable de repositorio
    # DEPLOY_ENABLED=true (Settings > Secrets and variables > Actions > Variables).
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      ENV_NAME: ${{ inputs.environment || 'dev' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      IMAGE_TAG: ${{ github.sha }}
      TF_DIR: infra/envs/${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-${{ github.run_id }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
          tofu_wrapper: false

      - name: Inicializar Terraform
        run: >
          tofu -chdir=$TF_DIR init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=$AWS_REGION"

      - name: Variables de Terraform
        run: |
          cat > $TF_DIR/ci.auto.tfvars.json <<EOF
          {"image_tag": "$IMAGE_TAG",
           "region": "$AWS_REGION",
           "certificate_arn": "${{ vars.ACM_CERTIFICATE_ARN }}",
           "dns_zone_name": "${{ vars.DNS_ZONE_NAME }}",
           "alert_emails": ${{ vars.ALERT_EMAILS || '[]' }}}
          EOF

      - name: Asegurar el repositorio de imágenes
        run: tofu -chdir=$TF_DIR apply -input=false -auto-approve -target=module.stack.module.api.aws_ecr_repository.api

      - name: Construir y subir la imagen (ARM64)
        run: |
          REPO=$(tofu -chdir=$TF_DIR output -raw ecr_repository_url)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker buildx create --use
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx build --platform linux/arm64 -t "$REPO:$IMAGE_TAG" --push backend
          echo "REPO=$REPO" >> $GITHUB_ENV

      # Toda la infraestructura y la tarea de migración, SIN tocar todavía el servicio:
      # así la base queda migrada antes de que corra la versión nueva (y en el primer
      # despliegue se crea todo desde cero en este paso).
      - name: Infraestructura y tarea de migración
        run: >
          tofu -chdir=$TF_DIR apply -input=false -auto-approve
          -exclude=module.stack.module.api.aws_ecs_service.api

      - name: Migraciones de base de datos
        run: |
          CLUSTER=$(tofu -chdir=$TF_DIR output -raw cluster_name)
          FAMILY=$(tofu -chdir=$TF_DIR output -raw migrate_task_family)
          SUBNETS=$(tofu -chdir=$TF_DIR output -json app_subnet_ids | jq -r 'join(",")')
          SG=$(tofu -chdir=$TF_DIR output -raw app_security_group_id)
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$FAMILY" --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migración terminó con código $CODE"
          if [ "$CODE" != "0" ]; then
            # Muestra el log del contenedor para diagnosticar sin entrar a AWS.
            GROUP=$(aws ecs describe-task-definition --task-definition "$FAMILY" \
              --query 'taskDefinition.containerDefinitions[0].logConfiguration.options."awslogs-group"' --output text)
            aws logs get-log-events --log-group-name "$GROUP" --log-stream-name "migrate/migrate/${TASK##*/}" \
              --query 'events[].message' --output text | tail -60
            exit 1
          fi

      - name: Desplegar
        run: |
          tofu -chdir=$TF_DIR plan -input=false -out=tfplan
          tofu -chdir=$TF_DIR apply -input=false tfplan
          aws ecs wait services-stable --cluster "$(tofu -chdir=$TF_DIR output -raw cluster_name)" \
            --services "$(tofu -chdir=$TF_DIR output -raw service_name)"

      - name: Prueba de humo
        run: |
          URL=$(tofu -chdir=$TF_DIR output -raw api_url)
          if [ -n "$URL" ]; then
            curl -fsS --retry 10 --retry-delay 6 "$URL/health/ready"
          else
            # Sin DNS todavía: se prueba directo al balanceador (el certificado no calza con ese nombre).
            curl -fsS --retry 5 --retry-delay 5 -k "https://$(tofu -chdir=$TF_DIR output -raw alb_dns_name)/health/ready"
          fi
