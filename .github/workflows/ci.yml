name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, tipos, pruebas y seguridad
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neo
          POSTGRES_PASSWORD: neo
          POSTGRES_DB: neobanco_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neo" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Tipos (mypy)
        run: mypy app
      - name: Migraciones aplican desde cero
        env:
          NEO_ENV: test
          NEO_DATABASE_URL: postgresql+asyncpg://neo:neo@localhost:5432/neobanco_test
        run: alembic upgrade head && alembic check
      - name: Pruebas
        env:
          NEO_TEST_DATABASE_URL: postgresql+asyncpg://neo:neo@localhost:5432/neobanco_test
        run: python -m pytest -q
      - name: Análisis de seguridad del código (bandit)
        run: bandit -q -r app -c pyproject.toml
      - name: Vulnerabilidades en dependencias (pip-audit)
        run: pip-audit -r requirements.txt

  secrets:
    name: Secretos filtrados (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Imagen · build y escaneo (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: neobanco-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: neobanco-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  infra:
    name: Infra · formato, validación y checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
      - name: Formato
        run: tofu fmt -check -recursive infra
      - name: Validar los tres ambientes
        run: |
          for env in dev staging prod; do
            tofu -chdir=infra/envs/$env init -backend=false -input=false
            tofu -chdir=infra/envs/$env validate
          done
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/modules
          framework: terraform
          quiet: true

  mobile:
    name: App · tipos y lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Vulnerabilidades en dependencias (con excepciones documentadas)
        run: npx --yes audit-ci@7.1.0 --config audit-ci.jsonc
