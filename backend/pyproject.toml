[project]
name = "neobanco-api"
version = "0.1.0"
description = "API del neobanco cooperativo: cuentas, tarjetas, transferencias, recibos, ahorro, préstamos y recompensas."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.161.1",
  "starlette==1.9.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy[asyncio]==2.1.6",
  "asyncpg==0.32.0",
  "alembic==1.20.1",
  "pydantic-settings==2.16.1",
  "argon2-cffi==25.1.0",
  "pyjwt[crypto]==2.15.1",
  "cryptography==50.0.2",
  "structlog==26.1.0",
  "redis==8.1.0",
  "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "ruff==0.17.2",
  "mypy==2.4.0",
  "bandit==1.9.4",
  "pip-audit==2.10.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"app/seed.py" = ["S311", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
